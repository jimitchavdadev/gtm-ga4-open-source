<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenAnalytics Debugger Panel</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="app-container">
    <header class="toolbar">
      <div class="logo">
        <span class="dot"></span>
        <strong>OpenAnalytics Debugger</strong>
      </div>
      <div class="controls">
        <input type="text" id="filter-input" placeholder="Filter events..." />
        <button id="clear-btn" class="btn">Clear</button>
        <button id="export-btn" class="btn btn-primary">Export JSON</button>
      </div>
    </header>

    <div class="main-layout">
      <aside class="event-list" id="event-list">
        <!-- Event items dynamically added -->
      </aside>

      <section class="details-panel" id="details-panel">
        <div class="empty-state">Select an event from the list to view its decoded parameters.</div>
      </section>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
