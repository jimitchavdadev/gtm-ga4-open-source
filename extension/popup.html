<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; font-family: -apple-system, sans-serif; font-size: 13px; padding: 14px; background: #ffffff; color: #0f172a; margin: 0; }
    .header { display: flex; items-center; gap: 8px; font-weight: bold; margin-bottom: 12px; }
    .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }
    .status-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; font-size: 12px; }
    .btn { display: block; width: 100%; margin-top: 10px; padding: 8px; background: #2563eb; color: #ffffff; text-align: center; border-radius: 6px; text-decoration: none; font-weight: 500; font-size: 12px; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot"></div>
    <span>OpenAnalytics Debugger</span>
  </div>
  <div class="status-box">
    <div>Status: <strong style="color:#10b981">Active & Hooked</strong></div>
    <div style="margin-top:4px;color:#64748b">Open Chrome DevTools (F12) and select the <strong>OpenAnalytics</strong> panel.</div>
  </div>
</body>
</html>
