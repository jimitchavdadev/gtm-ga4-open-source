services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: analytics-rust-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=sqlite:///data/analytics.db?mode=rwc
    volumes:
      - analytics_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/v1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: analytics-next-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - RUST_ENGINE_URL=http://engine:8080
    depends_on:
      engine:
        condition: service_healthy

volumes:
  analytics_data:
